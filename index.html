		<title>AutoMap Car Services</title>

		<link rel="shortcut icon" href="./favicon.ico" />

		<!-- Bootstrap -->

			rel="stylesheet"
		/>

		<link
			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"

		<nav class="navbar navbar-expand-lg navbar-dark custom-nav px-3">

		<!-- Hero Section -->

						TRUSTED <span class="text-expert">EXPERTS</span><br />
						FOR ALL YOUR <span class="text-expert">CAR</span> NEEDS
					</h1>
					<p class="lead hero-subtext">
						Fast And Reliable Service For All Car Brands
					</p>
					<div class="hero-buttons">
						<a
							href="tel:+177777777"
							class="btn call-btn text-white d-flex align-items-center"
						>
							<img
								src="images/mainImages/CallButtonIcon.png"
								class="me-2 icon"
							/>
							CALL NOW
						</a>
						<a href="#" class="btn our-service-btn">OUR SERVICE</a>

				</div>
				<div class="col-md-6 text-center">
					<img
						src="images/mainImages/MainPhoto.jpg"
						class="main-image"
						alt="Mechanic"
					/>
				</div>
			</div>
		</div>

		<div class="text-center mb-4">
			<div class="contact-box d-flex flex-column align-items-center">
				<div class="d-flex align-items-center mb-0">
					<img
						src="images/mainImages/LocationIcon.png"
						class="icon"
						alt="Location"
					/>

						href="https://www.google.com/maps?q=1425+Rankin+Ave,+Windsor,+ON"
						target="_blank"
						class="text-decoration-none text-dark ms-2"
					>
						1425 Rankin Ave, Windsor, ON
					</a>
				</div>
				<div class="d-flex align-items-center">
					<img src="images/mainImages/PhoneIcon.png" class="icon" alt="Phone" />
					<a href="tel:+177777777" class="text-decoration-none text-dark ms-2">
						+1 777 777 77
					</a>

			</div>

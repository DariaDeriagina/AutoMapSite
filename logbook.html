<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AutoMap Logbook</title>
		<link rel="shortcut icon" href="./favicon.ico" />
		<meta name="robots" content="noindex,nofollow" />

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="logbook.css" />
	</head>
	<body>
		<div id="gate"></div>

		<div id="app" hidden>
			<nav class="navbar navbar-expand-lg">
				<a class="navbar-brand text-white fw-bold" href="#">
					<img
						src="images/mainImages/LogoAutoMap.png"
						alt="AutoMap Logo"
						class="logo-img"
					/>
				</a>
			</nav>

			<div class="container">
				<h2 class="mb-4 text-center">AutoMap Service Logbook</h2>

				<form id="logForm" class="row g-3 mb-4">
					<div class="col-md-4">
						<label for="service" class="form-label">Service Provided</label>
						<select id="serviceSelect" class="form-select">
							<option value="">Choose from existing...</option>
							<option>Preventative Maintenance & Diagnostics</option>
							<option>Engine & Transmission Rebuild and Replacement</option>
							<option>Suspension Repairing</option>
							<option>Oil Change</option>
							<option>ECU Tuning</option>
							<option>Electrical Wiring Problem Solving</option>
						</select>
						<input
							type="text"
							id="service"
							class="form-control mt-2"
							placeholder="Or enter custom service name"
						/>
					</div>
					<div class="col-md-4">
						<label for="price" class="form-label">Price ($)</label>
						<input
							type="number"
							class="form-control"
							id="price"
							required
							min="1"
						/>
					</div>
					<div class="col-md-4 mt-5 mb-3">
						<div class="d-grid gap-2">
							<button type="submit" class="btn btn-primary">Add Entry</button>
							<button type="button" id="clearForm" class="btn btn-secondary">
								Clear
							</button>
						</div>
					</div>
				</form>

				<div class="totals-box mb-4">
					<h5>Totals:</h5>
					<p id="totalDay">Today: $0</p>
					<p id="totalWeek">This Week: $0</p>
					<p id="totalMonth">This Month: $0</p>
					<button
						class="btn btn-sm btn-outline-danger me-2"
						onclick="clearPeriod('day')"
					>
						🗑 Delete Today
					</button>
					<button
						class="btn btn-sm btn-outline-danger me-2"
						onclick="clearPeriod('week')"
					>
						🗑 Delete This Week
					</button>
					<button
						class="btn btn-sm btn-outline-danger"
						onclick="clearPeriod('month')"
					>
						🗑 Delete This Month
					</button>
					<button
						class="btn btn-sm btn-success float-end"
						onclick="exportCSV()"
					>
						⬇️ Export CSV
					</button>

					<button class="btn btn-sm btn-outline-secondary me-2" id="exportJson">
						⬇️ Backup JSON
					</button>

					<label class="btn btn-sm btn-outline-secondary">
						⬆️ Import JSON
						<input
							type="file"
							id="importJson"
							accept="application/json"
							hidden
						/>
					</label>
				</div>

				<table class="table table-striped">
					<thead>
						<tr>
							<th>Date</th>
							<th>Service</th>
							<th>Price</th>
							<th>Action</th>
						</tr>
					</thead>
					<tbody id="logTable"></tbody>
				</table>
			</div>
		</div>

		<script type="module" src="/firebase.app.js?v=7"></script>
		<script src="/auth.js?v=7"></script>
		<script src="/logbook.js?v=7"></script>
	</body>
</html>
